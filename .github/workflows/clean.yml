name: Remove old Click files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete files left over from the old UI
        run: |
          git rm --ignore-unmatch -- \
            app/src/main/java/zx/offical/click/util/ThumbnailLoader.kt \
            app/src/main/res/drawable/bg_drawer.xml \
            app/src/main/res/drawable/bg_mode_indicator.xml \
            app/src/main/res/drawable/bg_mode_track.xml \
            app/src/main/res/drawable/bg_pill.xml \
            app/src/main/res/drawable/bg_pill_active.xml \
            app/src/main/res/drawable/bg_popup.xml \
            app/src/main/res/drawable/bg_popup_item.xml \
            app/src/main/res/drawable/bg_rec_dot.xml \
            app/src/main/res/drawable/bg_recording.xml \
            app/src/main/res/drawable/bg_thumb.xml \
            app/src/main/res/drawable/bg_zoom_pill.xml \
            app/src/main/res/drawable/bg_zoom_pill_active.xml \
            app/src/main/res/drawable/drawer_handle.xml \
            app/src/main/res/drawable/flip_bg.xml \
            app/src/main/res/drawable/ic_aspect.xml \
            app/src/main/res/drawable/ic_focus_square.xml \
            app/src/main/res/drawable/ic_shutter_photo.xml \
            app/src/main/res/drawable/ic_shutter_rec.xml \
            app/src/main/res/drawable/ic_shutter_video.xml \
            app/src/main/res/drawable/ic_sliders.xml \
            app/src/main/res/drawable/ic_sun.xml \
            app/src/main/res/drawable/shutter_ring.xml \
            app/src/main/res/layout/activity_main.xml \
            app/src/main/res/layout/view_mode_scroller.xml \
            app/src/main/res/layout/view_shutter.xml \
            app/src/main/res/values/dimens.xml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --staged --quiet; then
            echo "Nothing to delete."
          else
            git commit -m "chore: remove old UI files"
            git push
          fi
